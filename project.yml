name: SuperResApp
options:
  bundleIdPrefix: com.superres
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  objectVersion: 56

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    ENABLE_BITCODE: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    EXPANDED_CODE_SIGN_IDENTITY: ""
    EXPANDED_CODE_SIGN_IDENTITY_NAME: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    DEVELOPMENT_TEAM: ""
    ONLY_ACTIVE_ARCH: "NO"
    ARCHS: "arm64"
    VALID_ARCHS: "arm64"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    GCC_OPTIMIZATION_LEVEL: "s"
    DEAD_CODE_STRIPPING: "YES"
    STRIP_INSTALLED_PRODUCT: "YES"
    COPY_PHASE_STRIP: "NO"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "需要相册权限以保存超分后的图片"
    INFOPLIST_KEY_NSCameraUsageDescription: "需要相机权限以进行实时超分预览"
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "需要相册权限以选择图片进行超分"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  SuperResApp:
    type: application
    platform: iOS
    sources:
      - path: SuperResApp
        excludes:
          - "Models/Builtin/**"
          - "Resources/**"
          - "Info.plist"
    resources:
      - path: SuperResApp/Resources/Assets.xcassets
      - path: SuperResApp/Resources/model_manifest.json
    postBuildScripts:
      - name: 复制内置 Core ML 模型
        script: |
          BUILTIN_DIR="$SRCROOT/SuperResApp/Models/Builtin"
          APP_DIR="$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app"
          echo "=== 复制内置模型到 $APP_DIR ==="
          for model in PiperSR_2x RealESRGAN_x4v3; do
            if [ -d "$BUILTIN_DIR/${model}.mlmodelc" ]; then
              rm -rf "$APP_DIR/${model}.mlmodelc"
              cp -R "$BUILTIN_DIR/${model}.mlmodelc" "$APP_DIR/"
              echo "  已复制 ${model}.mlmodelc"
            else
              echo "  警告: 未找到 ${model}.mlmodelc"
            fi
          done
          ls -la "$APP_DIR"/*.mlmodelc 2>/dev/null || echo "（无 .mlmodelc）"
        shell: /bin/sh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.superres.app"
        PRODUCT_NAME: "SuperResApp"
        INFOPLIST_FILE: "SuperResApp/Info.plist"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"
        ENABLE_PREVIEWS: "YES"
    dependencies:
      - package: ZIPFoundation
