name: 构建未签名 IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  APP_NAME: SuperResApp
  VERSION: 1.0.0

jobs:
  build:
    name: 构建 iOS 未签名包
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          # 安装 iOS 平台（Xcode 16 需单独下载平台）
          xcodebuild -downloadPlatform iOS || true
          xcodebuild -showsdks | grep -i iphone

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 下载并编译内置模型
        run: |
          chmod +x ./scripts/compile_builtin_models.sh
          ./scripts/compile_builtin_models.sh
          echo "=== 内置模型列表 ==="
          ls -lh SuperResApp/Models/Builtin/*.mlmodelc 2>/dev/null || echo "（未找到 .mlmodelc）"

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          # 兼容 Xcode 15.4：强制工程格式版本为 56（XcodeGen 新版默认 77 不兼容）
          /usr/bin/sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/' "${{ env.APP_NAME }}.xcodeproj/project.pbxproj"
          grep "objectVersion" "${{ env.APP_NAME }}.xcodeproj/project.pbxproj"

      - name: 解析 Swift 包依赖
        run: |
          xcodebuild -project "${{ env.APP_NAME }}.xcodeproj" \
            -scheme "${{ env.APP_NAME }}" \
            -resolvePackageDependencies

      - name: 编译归档（未签名）
        run: |
          xcodebuild archive \
            -project "${{ env.APP_NAME }}.xcodeproj" \
            -scheme "${{ env.APP_NAME }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/${{ env.APP_NAME }}.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY_NAME="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            2>&1 | tee build.log

      - name: 导出未签名 IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/${{ env.APP_NAME }}.xcarchive/Products/Applications/${{ env.APP_NAME }}.app" build/Payload/
          cd build && zip -qr "${{ env.APP_NAME }}-unsigned.ipa" Payload
          ls -lh "${{ env.APP_NAME }}-unsigned.ipa"

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-v${{ env.VERSION }}.ipa
          path: build/${{ env.APP_NAME }}-unsigned.ipa
          retention-days: 30

      - name: 构建失败时输出日志
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "=== 构建日志末尾 200 行 ==="
            tail -200 build.log
          fi
