name: 构建未签名 IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  APP_NAME: SuperResApp
  VERSION: 1.0.9  # ⭐️ 假设当前是 1.0.9，测试逢九进一

jobs:
  build:
    name: 构建 iOS 未签名包
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ⭐️ 核心新增：计算逢九进一的版本号
      - name: 计算新版本号 (逢九进一)
        id: version_bump
        run: |
          CURRENT="${{ env.VERSION }}"
          echo "当前基础版本: $CURRENT"
          
          IFS='.' read -r major minor patch <<< "$CURRENT"
          
          # 个位加 1
          patch=$((patch + 1))
          
          # 逢九进一逻辑
          if [ "$patch" -gt 9 ]; then
              patch=0
              minor=$((minor + 1))
          fi
          
          if [ "$minor" -gt 9 ]; then
              minor=0
              major=$((major + 1))
          fi
          
          NEW_VER="$major.$minor.$patch"
          echo "计算后的新版本: $NEW_VER"
          
          # 将新版本号写入环境变量，供后续步骤（编译、打包）使用
          echo "NEW_VERSION=$NEW_VER" >> $GITHUB_ENV

      - name: 配置 Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -showsdks | grep -i iphone

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          /usr/bin/sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/' "${{ env.APP_NAME }}.xcodeproj/project.pbxproj"
          grep "objectVersion" "${{ env.APP_NAME }}.xcodeproj/project.pbxproj"
          echo "=== 内置模型列表 ==="
          ls -lh SuperResApp/Models/Builtin/*.mlmodelc 2>/dev/null || echo "（未找到 .mlmodelc）"

      - name: 解析 Swift 包依赖
        run: |
          xcodebuild -project "${{ env.APP_NAME }}.xcodeproj" \
            -scheme "${{ env.APP_NAME }}" \
            -resolvePackageDependencies

      - name: 编译构建（未签名）
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${{ env.APP_NAME }}.xcodeproj" \
            -scheme "${{ env.APP_NAME }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY_NAME="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            MARKETING_VERSION="${{ env.NEW_VERSION }}" \
            2>&1 | tee build.log

      - name: 导出未签名 IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/${{ env.APP_NAME }}.app"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -qr "${{ env.APP_NAME }}-unsigned-v${{ env.NEW_VERSION }}.ipa" Payload
          ls -lh "${{ env.APP_NAME }}-unsigned-v${{ env.NEW_VERSION }}.ipa"
          echo "=== App 内模型检查 ==="
          find "Payload/${{ env.APP_NAME }}.app" -name "*.mlmodelc" -type d || echo "（未找到 .mlmodelc）"

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          # ⭐️ 这里换成新计算的版本号
          name: ${{ env.APP_NAME }}-unsigned-v${{ env.NEW_VERSION }}.ipa
          path: build/${{ env.APP_NAME }}-unsigned-v${{ env.NEW_VERSION }}.ipa
          retention-days: 30

      - name: 构建失败时输出日志
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "================ 构建失败！所有 Error 日志如下 ================"
            grep -i -n -B 2 -A 2 "error:" build.log || echo "⚠️ 未找到包含 'error:' 的行"
            echo "=============================================================="
          else
            echo "❌ 找不到 build.log 文件。"
          fi