name: 构建未签名 IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  APP_NAME: SuperResApp
  VERSION: 1.0.0

jobs:
  build:
    name: 构建 iOS 未签名包
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -showsdks | grep -i iphone

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          /usr/bin/sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/' "${{ env.APP_NAME }}.xcodeproj/project.pbxproj"
          grep "objectVersion" "${{ env.APP_NAME }}.xcodeproj/project.pbxproj"
          echo "=== 内置模型列表 ==="
          ls -lh SuperResApp/Models/Builtin/*.mlmodelc 2>/dev/null || echo "（未找到 .mlmodelc）"

      - name: 解析 Swift 包依赖
        run: |
          xcodebuild -project "${{ env.APP_NAME }}.xcodeproj" \
            -scheme "${{ env.APP_NAME }}" \
            -resolvePackageDependencies

      - name: 编译构建（未签名）
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${{ env.APP_NAME }}.xcodeproj" \
            -scheme "${{ env.APP_NAME }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY_NAME="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            2>&1 | tee build.log

      - name: 导出未签名 IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/${{ env.APP_NAME }}.app"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -qr "${{ env.APP_NAME }}-unsigned.ipa" Payload
          ls -lh "${{ env.APP_NAME }}-unsigned.ipa"
          echo "=== App 内模型检查 ==="
          find "Payload/${{ env.APP_NAME }}.app" -name "*.mlmodelc" -type d || echo "（未找到 .mlmodelc）"

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-v${{ env.VERSION }}.ipa
          path: build/${{ env.APP_NAME }}-unsigned.ipa
          retention-days: 30

      - name: 构建失败时输出日志
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "================ 构建失败！所有 Error 日志如下 ================"
            # -i 忽略大小写，-n 显示行号，-B 2 -A 2 显示前后各2行上下文
            grep -i -n -B 2 -A 2 "error:" build.log || echo "⚠️ 未找到包含 'error:' 的行，请检查是否发生了不可恢复的链接或崩溃。"
            echo "=============================================================="
            echo "附带提取包含 fatal 或 failed 的行（如果有）："
            grep -i -n "fatal" build.log || echo "（未发现 fatal 错误）"
          else
            echo "❌ 找不到 build.log 文件，可能编译阶段未正常启动。"
          fi