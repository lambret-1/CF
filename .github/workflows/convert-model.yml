name: Convert Time-Aware AWB to CoreML
on: [workflow_dispatch]

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install torch torchvision coremltools numpy

      - name: 下载官方预训练权重（含自动重试与 CDN 兜底）
        run: |
          URL_RAW="https://raw.githubusercontent.com/SamsungLabs/time-aware-awb/main/models/model-awb-pref.pt"
          URL_CDN="https://cdn.jsdelivr.net/gh/SamsungLabs/time-aware-awb@main/models/model-awb-pref.pt"
          
          echo "尝试从官方源下载..."
          if wget -q --tries=3 --timeout=15 -O model-awb-pref.pt "$URL_RAW" && [ $(stat -c%s model-awb-pref.pt 2>/dev/null || echo 0) -gt 100000 ]; then
            echo "✅ 官方源下载成功"
          else
            echo "⚠️ 官方源失败，切换到 jsDelivr CDN 下载..."
            rm -f model-awb-pref.pt
            wget -q --tries=3 --timeout=15 -O model-awb-pref.pt "$URL_CDN"
          fi
          
          # 检查最终是否成功
          FILE_SIZE=$(stat -c%s model-awb-pref.pt 2>/dev/null || echo 0)
          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "❌ 权重文件下载失败或文件过小 (大小: $FILE_SIZE 字节)"
            exit 1
          fi
          ls -lh model-awb-pref.pt

      - name: 执行转换脚本
        run: |
          python convert_awb.py

      - name: 上传 CoreML 模型
        uses: actions/upload-artifact@v4
        with:
          name: TimeAwareAWB-CoreML
          path: TimeAwareAWB.mlpackage
          retention-days: 30