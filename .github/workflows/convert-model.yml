name: Convert Time-Aware AWB to CoreML
on: [workflow_dispatch]

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install torch torchvision coremltools numpy

      - name: 克隆官方仓库并拉取 Git LFS 权重
        run: |
          # 克隆完整仓库
          git clone https://github.com/SamsungLabs/time-aware-awb.git
          cd time-aware-awb
          # 拉取真实的大文件（.pt 权重）
          git lfs pull
          
          # 检查权重文件是否真实存在且大小正常
          WEIGHT_PATH="models/model-awb-pref.pt"
          if [ ! -f "$WEIGHT_PATH" ]; then
            echo "❌ 权重文件不存在"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$WEIGHT_PATH")
          echo "权重文件大小: $FILE_SIZE 字节"
          
          # 如果文件仍然很小（比如只有几十KB），说明 LFS 拉取失败
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ 权重文件过小，可能是 LFS 指针文件而非真实模型"
            exit 1
          fi

      - name: 执行转换脚本
        run: |
          # 将官方代码路径和权重路径传递给转换脚本
          python convert_awb.py

      - name: 上传 CoreML 模型
        uses: actions/upload-artifact@v4
        with:
          name: TimeAwareAWB-CoreML
          path: TimeAwareAWB.mlpackage
          retention-days: 7